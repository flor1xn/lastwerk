name: Sicherheitshinweise

# RUSTSEC-Hinweise für beide Lockdateien (Wurzel und Tauri-Projekt). Läuft, wenn sich eine
# Lockdatei, ein Manifest oder deny.toml ändert, und vor jedem Release (release.yml). Kein
# täglicher Lauf mehr (T46): Er wurde ohne Commit rot und blockierte dann jeden Release; neue
# Hinweise zu bestehenden Abhängigkeiten meldet GitHub über Dependabot.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'app/src-tauri/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/advisories.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  advisories:
    name: RUSTSEC (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny installieren
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny advisories (Wurzel)
        run: cargo deny check advisories
      - name: cargo-deny advisories (Tauri-Projekt)
        if: success() || failure()
        run: cargo deny --manifest-path app/src-tauri/Cargo.toml --config deny.toml check advisories
