name: Release veröffentlichen

# Veröffentlicht einen geprüften Release-Entwurf (release.yml). Für Cloud-Sessions, die keinen
# Tag pushen und keinen Entwurf direkt veröffentlichen können (15. Oktober 2026). Beim
# Veröffentlichen legt GitHub den Tag auf dem Ziel-Commit des Entwurfs an. Kein Checkout,
# kein Code aus dem Repository.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag des Entwurfs, zum Beispiel v1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Entwurf veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Tag prüfen
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag muss die Form vX.Y.Z haben."; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Nur auf main."; exit 1
          fi
      - name: Entwurf prüfen und veröffentlichen
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "Kein Entwurf zu $TAG (schon veröffentlicht oder nicht vorhanden)."; exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,url
