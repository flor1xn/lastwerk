name: CI

on:
  push:
    # Arbeitszweige der Sessions (claude/...) laufen mit, damit Fehler vor main sichtbar werden.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Auf main nie abbrechen: Jeder Commit dort braucht ein Ergebnis. Bis 15. Oktober 2026 blieben
  # 10 Commits auf main ohne Ergebnis, weil der nächste Push den Lauf abbrach.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guards:
    name: Datenschutz, Isolation, Sprachdateien
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Der Secret-Scan prüft den ganzen Verlauf, nicht nur den letzten Stand.
          fetch-depth: 0
      - name: Keine privaten Daten im Index
        run: sh scripts/check-privacy.sh
      # Die Prüfung selbst: erzeugt synthetische Fundstücke zur Laufzeit (T38). Dieselben Tests
      # laufen im Job rust auch unter Windows (Git Bash).
      - name: Tests der Datenschutzprüfung und der Verlaufsprüfung
        run: |
          sh scripts/test-check-privacy.sh
          sh scripts/test-check-history.sh
      - name: Isolation von bridge/ und crates/ und app/
        run: sh scripts/check-isolation.sh
      - name: Schlüsselgleichheit der Sprachdateien
        run: sh scripts/check-i18n.sh
      # Syntaxprüfung aller Workflows, auch des Release-Workflows, den nur ein Tag auslöst.
      - name: Workflows prüfen (actionlint)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      # Angriffsfläche der Workflows (T38): Actions per Commit-SHA, Rechte, Auslöser, Ausdrücke.
      - name: Workflows auf Angriffsfläche prüfen (zizmor)
        run: |
          python3 -m pip install --user zizmor==1.31.0
          "$HOME/.local/bin/zizmor" --offline --min-severity medium --format plain .github/workflows
      # SPEC 10.2 und 11.4: keine Treffer des Secret-Scanners. check-privacy.sh prüft nur
      # Dateinamen, gitleaks die Inhalte aller Commits.
      - name: Secret-Scan (gitleaks)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.18.4
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner --redact

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ohne macOS (Entscheidung vom 15. Oktober 2026): Es ist kein Mac im Einsatz, und im
        # privaten Repository zählte eine macOS-Minute zehnfach.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Die Datenschutzprüfung ist POSIX-sh und muss auch in der Git Bash unter Windows laufen.
      - name: Datenschutzprüfung (Git Bash)
        shell: bash
        run: |
          sh scripts/check-privacy.sh
          sh scripts/test-check-privacy.sh
      - name: Lockfile vorhanden?
        id: lock
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Toolchain
        run: |
          # Version und Komponenten aus rust-toolchain.toml (fest, damit neue Lints nicht
          # ungefragt jeden Push rot machen).
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Cargo.lock als Artefakt (nur solange keins eingecheckt ist)
        if: matrix.os == 'ubuntu-latest' && steps.lock.outputs.present == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: Cargo.lock

  supply-chain:
    name: Lizenzen und Quellen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Feste Version: Eine neue cargo-deny-Version kann Regeln anders auslegen.
      - name: cargo-deny installieren
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # Nur Lizenzen, Verbote und Quellen. Sicherheitshinweise (RUSTSEC) prüft advisories.yml
      # täglich und vor jedem Release; ein neu veröffentlichter Hinweis macht so nicht jeden
      # Push rot (Analyse vom 15. Oktober 2026).
      - name: cargo-deny (Wurzel)
        run: cargo deny check bans licenses sources
      # Das Tauri-Projekt ist ein eigener Workspace mit eigener Lockdatei.
      - name: cargo-deny (Tauri-Projekt)
        run: cargo deny --manifest-path app/src-tauri/Cargo.toml --config deny.toml check bans licenses sources

  ui:
    name: Oberfläche (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lockfile vorhanden?
        id: lock
        working-directory: .
        run: |
          if [ -f app/ui/pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Abhängigkeiten (festgeschrieben)
        if: hashFiles('app/ui/pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Abhängigkeiten (erster Lauf ohne Lockfile)
        if: hashFiles('app/ui/pnpm-lock.yaml') == ''
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typprüfung
        run: pnpm check
      - name: Tests
        run: pnpm test
      # SPEC 10.2: Sicherheitslücken in den Paketen, die in die App gehen.
      - name: Sicherheitslücken (pnpm audit)
        run: pnpm audit --prod
      - name: pnpm-lock.yaml als Artefakt (nur solange keins eingecheckt ist)
        if: steps.lock.outputs.present == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-lock
          path: app/ui/pnpm-lock.yaml

  # Tauri-Hülle und Oberfläche zusammen (T06, SPEC 12 M2). Eigener Job, weil nur dieser die
  # Systembibliotheken von Tauri braucht. `app/src-tauri` ist ein eigenes Cargo-Projekt außerhalb
  # des Wurzel-Workspace, der Job `rust` oben bleibt davon unberührt.
  tauri:
    name: Tauri-Hülle (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Seit 1.0 entstehen acht große Test-Binaries mit Tauri, WebKitGTK und dem Garmin-Zugang.
      # Mit voller Debug-Information brach der Linker auf dem Runner mit "Bus error" ab
      # (Speicher und Platte). Zeilentabellen reichen für Rückverfolgungen in Tests.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev xdg-utils xvfb \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Abhängigkeiten der Oberfläche (festgeschrieben)
        run: pnpm --dir app/ui install --frozen-lockfile
      - name: Lint
        run: pnpm --dir app/ui lint
      - name: Typprüfung
        run: pnpm --dir app/ui check
      - name: Tests der Oberfläche
        run: pnpm --dir app/ui test
      - name: Chromium für Playwright
        run: pnpm --dir app/ui exec playwright install --with-deps chromium
      - name: Rauchtest (Playwright, blockiert fremde Hosts)
        run: pnpm --dir app/ui exec playwright test
      - name: Screenshots der Oberfläche (synthetische Daten)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: app/ui/test-results/
          if-no-files-found: ignore
      - name: Toolchain
        run: |
          # Version und Komponenten aus rust-toolchain.toml (fest, damit neue Lints nicht
          # ungefragt jeden Push rot machen).
          rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - name: Format (Tauri-Projekt)
        run: cargo fmt --check
        working-directory: app/src-tauri
      - name: Clippy (Tauri-Projekt)
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
      - name: Platz und Speicher vor den Tests
        run: df -h . /tmp && free -m
      - name: Tests (Tauri-Projekt)
        run: cargo test --locked
        working-directory: app/src-tauri
      - name: Debug-Build der App
        run: pnpm --dir app/ui exec tauri build --debug
      - name: Debug-Binary als Artefakt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lastwerk-app-debug-linux
          path: app/src-tauri/target/debug/lastwerk-app
      - name: Start für fünf Sekunden
        shell: bash
        env:
          # Eigene Datenbank unter dem Arbeitsordner, nichts im Benutzerprofil des Runners.
          LASTWERK_DB: ${{ runner.temp }}/smoke/lastwerk.db
        run: |
          set +e
          xvfb-run -a timeout 5 app/src-tauri/target/debug/lastwerk-app
          code=$?
          echo "Exit-Code: $code"
          # 124: läuft nach fünf Sekunden noch und wurde vom Zeitlimit beendet, das ist der
          # Sollfall. 0: sauber beendet. Alles andere ist ein Absturz.
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then exit 1; fi

  # Einrichtung von Ollama (T29 Teil A). Das gebündelte Skript läuft nur im Trockenlauf und mit
  # falschen Parametern, unter Windows PowerShell 5.1 (so ruft der Installer es auf) und unter
  # PowerShell 7. Kein Download, keine Installation, kein Modell, kein Zugriff auf Ollama.
  ollama-setup:
    name: Ollama-Einrichtung (Windows, Trockenlauf)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vertrag unter Windows PowerShell 5.1
        run: pwsh -NoProfile -File scripts/test-ollama-setup.ps1 -Engine powershell
      - name: Vertrag unter PowerShell 7
        run: pwsh -NoProfile -File scripts/test-ollama-setup.ps1 -Engine pwsh
      # Fehler (und Syntax, die Windows PowerShell 5.1 nicht kennt) lassen den Job scheitern,
      # Warnungen stehen nur im Protokoll. Einziger Netzzugriff des Jobs: die PowerShell Gallery.
      - name: PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0
          $settings = @{
            Rules = @{
              PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1', '7.0') }
            }
          }
          $blocking = 0
          foreach ($file in @('app/src-tauri/resources/ollama-setup.ps1', 'scripts/test-ollama-setup.ps1')) {
            $findings = @(Invoke-ScriptAnalyzer -Path $file -Settings $settings)
            Write-Host "$file`: $($findings.Count) finding(s)"
            $findings | Format-Table -AutoSize RuleName, Severity, Line, Message | Out-String -Width 300 | Write-Host
            $blocking += @($findings | Where-Object {
                $_.Severity -eq 'Error' -or $_.Severity -eq 'ParseError' -or $_.RuleName -eq 'PSUseCompatibleSyntax'
              }).Count
          }
          if ($blocking -gt 0) { throw "$blocking blocking finding(s)" }

  # Der NSIS-Hook (T29) wird sonst erst beim Release übersetzt. Hier mit einem Rumpf, der die
  # Umgebung aus installer.nsi von tauri-bundler 2.10.2 nachbildet (Includes, StrLoc, Variablen
  # PassiveMode und UpdateMode, Sprachen Englisch und Deutsch). Warnungen sind Fehler.
  installer-hook:
    name: NSIS-Hook (Übersetzung)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - name: Hook übersetzen
        run: |
          stub="${RUNNER_TEMP}/hook-check.nsi"
          cat > "$stub" <<'EOF'
          Unicode true
          !include MUI2.nsh
          !include FileFunc.nsh
          !include x64.nsh
          !include WordFunc.nsh
          !include StrFunc.nsh
          ${StrCase}
          ${StrLoc}
          !include "${HOOKS}"
          Var PassiveMode
          Var UpdateMode
          Name "HookCheck"
          OutFile "${OUT}"
          RequestExecutionLevel user
          InstallDir "$LOCALAPPDATA\HookCheck"
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          !insertmacro MUI_LANGUAGE "German"
          Section Install
            StrCpy $PassiveMode 0
            StrCpy $UpdateMode 0
            ${StrCase} $0 "x" "U"
            !ifmacrondef NSIS_HOOK_POSTINSTALL
              !error "NSIS_HOOK_POSTINSTALL fehlt"
            !endif
            !insertmacro NSIS_HOOK_POSTINSTALL
          SectionEnd
          EOF
          makensis -INPUTCHARSET UTF8 -WX -V2 \
            "-DHOOKS=${GITHUB_WORKSPACE}/app/src-tauri/windows/hooks.nsh" \
            "-DOUT=${RUNNER_TEMP}/hook-check.exe" \
            "$stub"
