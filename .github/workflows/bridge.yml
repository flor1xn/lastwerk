name: Bridge

# Zusatzprogramm in bridge/ (SPEC 13). Eigene CI-Datei mit Pfadfilter (SPEC 1.5).
# Pfadfilter auch auf catalog/ und schema/, weil push, normalize und das Manifest den Katalog,
# die Sprachdateien und die Schemas von dort lesen und die Tests darauf aufbauen.
# Die Schritte laufen erst, wenn bridge/pyproject.toml existiert (ab Task T11).

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - "bridge/**"
      - "catalog/**"
      - "schema/**"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "catalog/**"
      - "schema/**"
      - ".github/workflows/bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Python 3.12 (uv)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Projekt vorhanden?
        id: has
        working-directory: .
        run: |
          if [ -f bridge/pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "bridge/pyproject.toml fehlt noch, Schritte werden übersprungen."
          fi
      - name: uv
        if: steps.has.outputs.found == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python 3.12
        if: steps.has.outputs.found == 'true'
        run: uv python install 3.12
      - name: Abhängigkeiten
        if: steps.has.outputs.found == 'true'
        run: uv sync --locked
      - name: Lint und Format (ruff)
        if: steps.has.outputs.found == 'true'
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Tests (ohne Netzwerk, mit Attrappen-Client)
        if: steps.has.outputs.found == 'true'
        run: uv run pytest -q
