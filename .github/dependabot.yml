version: 2
# Monatlich, kleine Aktualisierungen je Ökosystem in einem PR. Übernommen wird in einer Session
# als eigener Commit (CLAUDE.md), nicht per Merge.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      klein:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: monthly
    groups:
      klein:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /app/ui
    schedule:
      interval: monthly
    groups:
      klein:
        update-types: [minor, patch]
    ignore:
      # Typen folgen Node 22 (engines in app/ui/package.json).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # uv, nicht pip: pip änderte nur pyproject.toml, nicht uv.lock.
  - package-ecosystem: uv
    directory: /bridge
    schedule:
      interval: monthly
    groups:
      klein:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      klein:
        update-types: [minor, patch]
