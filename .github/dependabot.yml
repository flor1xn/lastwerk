version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app/ui
    schedule:
      interval: weekly
    ignore:
      # @types/node folgt der Node-Hauptversion der CI und der Entwicklung (Node 22,
      # engines in app/ui/package.json). Typen für eine neuere Hauptversion wären falsch.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /bridge
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
