[package]
name = "lastwerk-coach"
description = "Optionale Anbindung eines lokalen Sprachmodells"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Vermerke zu Name, Version, Lizenz und Grund: docs/tasks/T15-coach-llm.md.
[dependencies]
lastwerk-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2.0"
# Schema-Prüfung der Antwort des Modells (SPEC 5.3, 9.4). Wie in cli: keine Auflösung von
# Verweisen über Netzwerk oder Dateisystem.
jsonschema = { version = "0.58", default-features = false }
# Blockierender HTTP-Client zu Ollama und lokalen OpenAI-kompatiblen Servern (SPEC 5.3). Ohne
# Standardfeatures: kein TLS, keine Kompression, kein JSON-Zwang. Nur `http` zu Loopback oder
# bestätigten Hosts im lokalen Netz.
ureq = { version = "3.4", default-features = false }

[lints]
workspace = true
