[package]
name = "lastwerk-fit"
description = "Einlesen von FIT-Dateien"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Eigener minimaler Decoder ohne Garmin-Profildateien, Entscheidung zu SPEC 14 O2.
# Vermerke zu Name, Version, Lizenz und Grund: docs/tasks/T03-fit-parser.md.
[dependencies]
lastwerk-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
# Nur Datumstypen, wie in lastwerk-core: ohne Systemuhr und Zeitzonendatenbank.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2.0"

[dev-dependencies]
lastwerk-testkit = { path = "../testkit" }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
