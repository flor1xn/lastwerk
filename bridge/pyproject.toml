[project]
name = "lastwerk-bridge"
version = "0.1.0"
description = "Zusatzprogramm fuer Lastwerk: holt Garmin-Daten lesend in ein lokales Archiv (SPEC 5.5, 13)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = [
    "curl-cffi==0.16.3",
    "garminconnect==0.3.17",
]

[project.scripts]
lastwerk-bridge = "lastwerk_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastwerk_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
